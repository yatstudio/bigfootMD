name: Desktop Trial Artifacts

on:
  workflow_dispatch:

concurrency:
  group: desktop-trial-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  version:
    name: Compute trial version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=0.1.${GITHUB_RUN_NUMBER}-trial" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: version
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
          - arch: x86_64
            target: x86_64-apple-darwin
            label: macOS-Intel
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set trial version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v | .bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
      - name: Build macOS app bundle
        env:
          VITE_SENTRY_RELEASE: ${{ needs.version.outputs.version }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app
      - name: Package app as tar.gz
        run: |
          mkdir -p artifacts
          APP_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          tar -C "$(dirname "$APP_PATH")" -czf "artifacts/Bigfoot_${{ needs.version.outputs.version }}_${{ matrix.label }}.app.tar.gz" "$(basename "$APP_PATH")"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bigfoot-${{ matrix.label }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            fcitx5-frontend-gtk3 \
            libfuse2 \
            librsvg2-dev \
            curl \
            wget \
            patchelf \
            build-essential \
            file \
            rpm
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set trial version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v | .bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
      - name: Build Linux bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          VITE_SENTRY_RELEASE: ${{ needs.version.outputs.version }}
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bigfoot-Linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Tauri Windows tools
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: ${{ runner.os }}-tauri-tools-nsis-3.11-nsis-tauri-utils-0.5.3
      - name: Prefetch Tauri NSIS toolchain
        shell: pwsh
        run: ./.github/scripts/prefetch-tauri-nsis.ps1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set trial version
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $tauri = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $tauri.version = $version
          $tauri.bundle.createUpdaterArtifacts = $false
          $tauri | ConvertTo-Json -Depth 100 | Set-Content "src-tauri/tauri.conf.json"
          (Get-Content "src-tauri/Cargo.toml") -replace '^version = ".*"$', "version = `"$version`"" | Set-Content "src-tauri/Cargo.toml"
      - name: Build Windows installer
        shell: pwsh
        env:
          VITE_SENTRY_RELEASE: ${{ needs.version.outputs.version }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bigfoot-Windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
